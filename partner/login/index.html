<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Partner-Login — WedConnect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf7f2;
    --fg: #2b2620;
    --muted: #7a7266;
    --accent: #b48b56;
    --card-bg: #ffffff;
    --error: #b1451f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: "Poppins", sans-serif;
    background: var(--bg);
    color: var(--fg);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: var(--card-bg);
    max-width: 420px;
    width: 100%;
    padding: 40px 36px;
    border-radius: 12px;
    box-shadow: 0 20px 50px -20px rgba(0,0,0,0.15);
  }
  .brand {
    font-family: "Cormorant Garamond", serif;
    font-weight: 600;
    font-size: 1.6rem;
    text-align: center;
    margin-bottom: 6px;
  }
  .brand span { color: var(--accent); }
  h1 {
    text-align: center;
    font-size: 1rem;
    font-weight: 500;
    color: var(--muted);
    margin: 0 0 28px;
  }
  label {
    display: block;
    font-size: 0.95rem;
    font-weight: 500;
    margin-bottom: 6px;
  }
  input {
    width: 100%;
    padding: 11px 14px;
    border: 1px solid #ddd6c9;
    border-radius: 8px;
    font-family: inherit;
    font-size: 0.95rem;
    margin-bottom: 18px;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 999px;
    background: linear-gradient(135deg, #f0c988, #b48b56);
    color: #1a1408;
    font-family: inherit;
    font-weight: 600;
    font-size: 1rem;
    letter-spacing: 0.03em;
    cursor: pointer;
    box-shadow: 0 6px 16px -8px rgba(139,102,53,0.6);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  button:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 20px -8px rgba(139,102,53,0.75);
  }
  .error {
    background: #fdeee7;
    color: var(--error);
    border: 1px solid #f3c8b3;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 0.95rem;
    margin-bottom: 18px;
    display: none;
  }
  .success {
    background: #eaf5ee;
    color: #3a7a4e;
    border: 1px solid #bfe0cb;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 0.95rem;
    margin-bottom: 18px;
    display: none;
  }
  .forgot-link {
    display: block;
    text-align: right;
    font-size: 0.9rem;
    color: var(--muted);
    text-decoration: none;
    margin: -10px 0 18px;
  }
  .foot {
    text-align: center;
    margin-top: 20px;
    font-size: 0.95rem;
    color: var(--muted);
  }
  .foot a { color: var(--accent); text-decoration: none; }
  .lang-switch { display: flex; justify-content: center; gap: 6px; margin-bottom: 22px; }
  .lang-switch button {
    width: auto; padding: 5px 12px; border-radius: 999px; background: none; border: 1px solid #ddd6c9;
    color: var(--muted); font-size: 0.85rem; font-weight: 600; letter-spacing: 0.02em; cursor: pointer;
  }
  .lang-switch button.active { background: var(--accent); border-color: var(--accent); color: #1a1408; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">Wed<span>Connect</span></div>
    <div class="lang-switch" id="lang-switch">
      <button type="button" data-lang="de">DE</button>
      <button type="button" data-lang="hu">HU</button>
      <button type="button" data-lang="en">EN</button>
    </div>
    <h1 id="t-heading">Partner-Login</h1>
    <div class="error" id="err"></div>
    <div class="success" id="ok">Ihr Passwort wurde geändert. Bitte loggen Sie sich mit dem neuen Passwort ein.</div>
    <form method="POST" action="/api/reseller-login">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autocomplete="username">
      <label for="jelszo" id="t-pwlabel">Passwort</label>
      <input type="password" id="jelszo" name="jelszo" required autocomplete="current-password">
      <a class="forgot-link" href="/partner/forgot-password" id="t-forgot">Passwort vergessen?</a>
      <button type="submit" id="t-submit">Einloggen</button>
    </form>
    <div class="foot"><span id="t-foot-q">Noch kein Konto?</span> <a href="/de/registrieren" id="t-foot-link">Partner werden</a></div>
  </div>
  <script>
    var COPY = {
      de: {
        heading: "Partner-Login", pwLabel: "Passwort", forgot: "Passwort vergessen?", submit: "Einloggen",
        footQ: "Noch kein Konto?", footLink: "Partner werden", registerHref: "/de/registrieren",
        success: "Ihr Passwort wurde geändert. Bitte loggen Sie sich mit dem neuen Passwort ein.",
        errors: {
          missing_fields: "Bitte füllen Sie beide Felder aus.",
          invalid: "Email oder Passwort ist falsch.",
          suspended: "Dieses Konto ist derzeit inaktiv. Bitte kontaktieren Sie uns.",
          rate_limited: "Zu viele Anmeldeversuche. Bitte versuchen Sie es in ein paar Minuten erneut.",
          generic: "Etwas ist schiefgelaufen. Bitte versuchen Sie es erneut."
        }
      },
      hu: {
        heading: "Partner bejelentkezés", pwLabel: "Jelszó", forgot: "Elfelejtett jelszó?", submit: "Bejelentkezés",
        footQ: "Még nincs fiókod?", footLink: "Legyél partner", registerHref: "/hu/regisztracio",
        success: "A jelszava megváltozott. Kérjük, jelentkezzen be az új jelszóval.",
        errors: {
          missing_fields: "Kérjük, töltse ki mindkét mezőt.",
          invalid: "Az email cím vagy a jelszó helytelen.",
          suspended: "Ez a fiók jelenleg inaktív. Kérjük, vegye fel velünk a kapcsolatot.",
          rate_limited: "Túl sok bejelentkezési kísérlet. Kérjük, próbálja meg néhány perc múlva újra.",
          generic: "Valami hiba történt. Kérjük, próbálja meg újra."
        }
      },
      en: {
        heading: "Partner login", pwLabel: "Password", forgot: "Forgot password?", submit: "Log in",
        footQ: "Don't have an account yet?", footLink: "Become a partner", registerHref: "/en/register",
        success: "Your password has been changed. Please log in with the new password.",
        errors: {
          missing_fields: "Please fill in both fields.",
          invalid: "Email or password is incorrect.",
          suspended: "This account is currently inactive. Please contact us.",
          rate_limited: "Too many login attempts. Please try again in a few minutes.",
          generic: "Something went wrong. Please try again."
        }
      }
    };

    var params = new URLSearchParams(location.search);
    var lang = params.get("lang");
    if (!COPY[lang]) lang = "de";
    var t = COPY[lang];

    document.documentElement.lang = lang;
    document.title = t.heading + " — WedConnect";
    document.getElementById("t-heading").textContent = t.heading;
    document.getElementById("t-pwlabel").textContent = t.pwLabel;
    document.getElementById("t-forgot").textContent = t.forgot;
    document.getElementById("t-submit").textContent = t.submit;
    document.getElementById("t-foot-q").textContent = t.footQ;
    document.getElementById("t-foot-link").textContent = t.footLink;
    document.getElementById("t-foot-link").href = t.registerHref;
    document.getElementById("ok").textContent = t.success;

    document.querySelectorAll("#lang-switch button").forEach(function (btn) {
      if (btn.getAttribute("data-lang") === lang) btn.classList.add("active");
      btn.addEventListener("click", function () {
        var p = new URLSearchParams(location.search);
        p.set("lang", btn.getAttribute("data-lang"));
        location.search = p.toString();
      });
    });

    if (params.get("reset")) {
      document.getElementById("ok").style.display = "block";
    }
    var err = params.get("error");
    if (err) {
      var box = document.getElementById("err");
      box.textContent = t.errors[err] || t.errors.generic;
      box.style.display = "block";
    }
  </script>
</body>
</html>
