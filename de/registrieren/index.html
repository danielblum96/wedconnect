<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/assets/favicon/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="/assets/favicon/favicon-16.png" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="/assets/favicon/apple-touch-icon.png">
<script src="/assets/cookie-consent.js?v=3"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Partner werden — WedConnect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf7f2;
    --fg: #2b2620;
    --muted: #7a7266;
    --accent: #b48b56;
    --card-bg: #ffffff;
    --error: #b1451f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: "Poppins", sans-serif;
    background: var(--bg);
    color: var(--fg);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    padding-bottom: 76px;
  }
  .card {
    background: var(--card-bg);
    max-width: 460px;
    width: 100%;
    padding: 40px 36px;
    border-radius: 12px;
    box-shadow: 0 20px 50px -20px rgba(0,0,0,0.15);
  }
  .brand {
    font-family: "Cormorant Garamond", serif;
    font-weight: 600;
    font-size: 1.6rem;
    text-align: center;
    margin-bottom: 6px;
  }
  .brand span { color: var(--accent); }
  h1 {
    text-align: center;
    font-size: 1rem;
    font-weight: 500;
    color: var(--muted);
    margin: 0 0 28px;
  }
  label {
    display: block;
    font-size: 0.95rem;
    font-weight: 500;
    margin-bottom: 6px;
  }
  input, select, textarea {
    width: 100%;
    padding: 11px 14px;
    border: 1px solid #ddd6c9;
    border-radius: 8px;
    font-family: inherit;
    font-size: 0.95rem;
    margin-bottom: 18px;
    background: #fff;
  }
  textarea { resize: vertical; min-height: 64px; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .section-divider {
    border: none;
    border-top: 1px solid #ece4d6;
    margin: 4px 0 20px;
  }
  .section-label {
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 4px;
  }
  .section-hint {
    font-size: 0.88rem;
    color: var(--muted);
    margin: -2px 0 14px;
  }
  .toggle-label {
    display: flex;
    align-items: flex-start;
    gap: 9px;
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--fg);
    background: #faf6ee;
    border: 1px solid #ece1cc;
    border-radius: 8px;
    padding: 11px 14px;
    margin-bottom: 18px;
    cursor: pointer;
  }
  .toggle-label input[type="checkbox"] {
    width: 16px;
    height: 16px;
    margin: 2px 0 0;
    flex: none;
    accent-color: var(--accent);
  }
  button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 999px;
    background: linear-gradient(135deg, #f0c988, #b48b56);
    color: #1a1408;
    font-family: inherit;
    font-weight: 600;
    font-size: 1rem;
    letter-spacing: 0.03em;
    cursor: pointer;
    box-shadow: 0 6px 16px -8px rgba(139,102,53,0.6);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  button:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 20px -8px rgba(139,102,53,0.75);
  }
  .error {
    background: #fdeee7;
    color: var(--error);
    border: 1px solid #f3c8b3;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 0.95rem;
    margin-bottom: 18px;
    display: none;
  }
  .hint { font-size: 0.88rem; color: var(--muted); margin: -12px 0 18px; }
  .hint-inline { font-weight: 400; color: var(--muted); }
  .field-row {
    display: grid;
    grid-template-columns: 1fr 2fr;
    gap: 12px;
  }
  .field-row input { margin-bottom: 18px; }
  .foot {
    text-align: center;
    margin-top: 20px;
    font-size: 0.95rem;
    color: var(--muted);
  }
  .foot a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">Wed<span>Connect</span></div>
    <h1>Werden Sie Partner</h1>
    <div class="error" id="err"></div>
    <form method="POST" action="/api/reseller-register">
      <input type="hidden" name="redirect_back" value="/de/registrieren">
      <label for="ceg_nev">Unternehmensname</label>
      <input type="text" id="ceg_nev" name="ceg_nev" required>

      <label for="orszag">Land</label>
      <select id="orszag" name="orszag" required>
        <option value="DE">Deutschland</option>
        <option value="AT">Österreich</option>
        <option value="CH">Schweiz</option>
        <option value="HU">Ungarn</option>
        <option value="OTHER">Sonstiges Land</option>
      </select>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autocomplete="username">

      <label for="jelszo">Passwort</label>
      <input type="password" id="jelszo" name="jelszo" required autocomplete="new-password" minlength="8">
      <div class="hint">Mindestens 8 Zeichen.</div>

      <hr class="section-divider">
      <div class="section-label">Rechnungs- &amp; Lieferadresse</div>
      <div class="section-hint">Optional – kann auch später im Konto ergänzt werden. Wird für Save-the-Date-Bestellungen automatisch vorausgefüllt.</div>

      <label for="adoszam">USt-IdNr. / Steuernummer <span class="hint-inline">(optional)</span></label>
      <input type="text" id="adoszam" name="adoszam" placeholder="z. B. DE123456789">

      <label for="szamlazasi_utca">Straße und Hausnummer</label>
      <input type="text" id="szamlazasi_utca" name="szamlazasi_utca">

      <div class="field-row">
        <div>
          <label for="szamlazasi_irsz">PLZ</label>
          <input type="text" id="szamlazasi_irsz" name="szamlazasi_irsz">
        </div>
        <div>
          <label for="szamlazasi_varos">Ort</label>
          <input type="text" id="szamlazasi_varos" name="szamlazasi_varos">
        </div>
      </div>

      <label for="szamlazasi_orszag">Land (Rechnungsadresse)</label>
      <select id="szamlazasi_orszag" name="szamlazasi_orszag">
        <option value="DE">Deutschland</option>
        <option value="AT">Österreich</option>
        <option value="CH">Schweiz</option>
        <option value="HU">Ungarn</option>
        <option value="OTHER">Sonstiges Land</option>
      </select>

      <label class="toggle-label">
        <input type="checkbox" id="szallitas_azonos" name="szallitas_azonos" value="1" checked>
        Lieferadresse ist identisch mit der Rechnungsadresse
      </label>

      <div id="shipping-group" hidden>
        <label for="alap_szallitasi_utca">Straße und Hausnummer (Lieferadresse)</label>
        <input type="text" id="alap_szallitasi_utca" name="alap_szallitasi_utca">

        <div class="field-row">
          <div>
            <label for="alap_szallitasi_irsz">PLZ</label>
            <input type="text" id="alap_szallitasi_irsz" name="alap_szallitasi_irsz">
          </div>
          <div>
            <label for="alap_szallitasi_varos">Ort</label>
            <input type="text" id="alap_szallitasi_varos" name="alap_szallitasi_varos">
          </div>
        </div>

        <label for="alap_szallitasi_orszag">Land (Lieferadresse)</label>
        <select id="alap_szallitasi_orszag" name="alap_szallitasi_orszag">
          <option value="DE">Deutschland</option>
          <option value="AT">Österreich</option>
          <option value="CH">Schweiz</option>
          <option value="HU">Ungarn</option>
          <option value="OTHER">Sonstiges Land</option>
        </select>
      </div>

      <button type="submit">Kostenlos registrieren</button>
    </form>
    <div class="foot">Bereits Partner? <a href="/partner/login">Hier einloggen</a></div>
  </div>
  <script>
    var params = new URLSearchParams(location.search);
    var err = params.get("error");
    if (err) {
      var messages = {
        missing_fields: "Bitte füllen Sie alle Felder aus.",
        weak_password: "Das Passwort muss mindestens 8 Zeichen haben.",
        invalid_email: "Bitte geben Sie eine gültige Email-Adresse ein.",
        email_exists: "Diese Email-Adresse ist bereits registriert.",
        rate_limited: "Zu viele Registrierungsversuche. Bitte versuchen Sie es später erneut."
      };
      var box = document.getElementById("err");
      box.textContent = messages[err] || "Etwas ist schiefgelaufen. Bitte versuchen Sie es erneut.";
      box.style.display = "block";
    }

    var azonosCheckbox = document.getElementById("szallitas_azonos");
    var shippingGroup = document.getElementById("shipping-group");
    if (azonosCheckbox && shippingGroup) {
      azonosCheckbox.addEventListener("change", function () {
        shippingGroup.hidden = azonosCheckbox.checked;
      });
    }
  </script>
<footer style="position:fixed; left:0; right:0; bottom:0; text-align:center; padding:14px 20px; font-size:0.8rem; background:rgba(250,247,242,0.9); backdrop-filter:blur(4px);"><a href="#" data-cookie-settings style="color:#8c6d34;">Cookie-Einstellungen</a></footer>
</body>
</html>
