<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WedConnect</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0b0d12;
    --bg-alt: #12151c;
    --text: #f5f6f8;
    --muted: #9aa2b1;
    --accent: #5b8cff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(circle at 50% 20%, var(--bg-alt), var(--bg));
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .wrap {
    max-width: 560px;
  }
  .logo {
    font-size: 2.5rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 12px;
  }
  .logo span {
    color: var(--accent);
  }
  .tag {
    font-size: 1.1rem;
    color: var(--muted);
    margin-bottom: 32px;
  }
  .badge {
    display: inline-block;
    font-size: 0.8rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid rgba(91, 140, 255, 0.4);
    border-radius: 999px;
    padding: 6px 16px;
    margin-bottom: 28px;
  }
  .contact {
    margin-top: 32px;
    font-size: 0.95rem;
    color: var(--muted);
  }
  a {
    color: var(--accent);
    text-decoration: none;
  }
  a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="badge">Coming soon</div>
    <div class="logo">Wed<span>Connect</span></div>
    <div class="tag">Something new is on its way.</div>
    <div class="contact">
      Get in touch — <a href="mailto:hello@wedconnect.eu">hello@wedconnect.eu</a>
    </div>
  </div>
</body>
</html>
