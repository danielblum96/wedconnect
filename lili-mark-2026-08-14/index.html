<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Lili &amp; Márk esküvője — 2026.08.14.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: linear-gradient(160deg, #f5e7c6, #e3bd7c);
    --fg: #6b3d1f;
    --accent: #b1451f;
    --accent-text: #883518;
    --btn-fg: #fbfbfa;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: "Cormorant Garamond", serif;
    background: var(--bg);
    color: var(--fg);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    text-align: center;
  }
  .card {
    max-width: 640px;
    width: 100%;
    padding: 56px 40px 48px;
    position: relative;
  }
  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    border: 1px solid var(--accent);
    opacity: 0.55;
  }
  .card::after {
    content: "";
    position: absolute;
    inset: 10px;
    border: 1px solid var(--accent);
    opacity: 0.3;
  }
  .eyebrow {
    font-family: "Poppins", sans-serif;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--accent-text);
    margin-bottom: 22px;
  }
  .names {
    font-family: "Cormorant Garamond", serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(2.6rem, 8vw, 4rem);
    line-height: 1.15;
    color: var(--fg);
    margin: 0 0 10px;
    overflow-wrap: break-word;
    word-break: break-word;
    hyphens: auto;
  }
  .amp { color: var(--accent-text); padding: 0 0.15em; }
  .date {
    font-family: "Poppins", sans-serif;
    font-size: 1rem;
    font-weight: 500;
    letter-spacing: 0.14em;
    color: var(--accent-text);
    margin-bottom: 30px;
  }
  .divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin: 0 auto 30px;
    max-width: 260px;
  }
  .divider .line {
    flex: 1;
    height: 1px;
    background: var(--accent);
    opacity: 0.5;
  }
  .divider .mark {
    color: var(--accent-text);
    font-size: 1.1rem;
    transform: rotate(45deg);
  }
  .message {
    font-size: 1.4rem;
    font-style: italic;
    line-height: 1.55;
    color: var(--fg);
    margin: 0 0 14px;
  }
  .cta-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }
  .cta {
    display: inline-block;
    padding: 14px 34px;
    background: var(--accent);
    color: var(--btn-fg);
    border-radius: 999px;
    font-family: "Poppins", sans-serif;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-decoration: none;
    box-shadow: 0 8px 18px -8px rgba(20, 20, 20, 0.35);
  }
  .cta-secondary {
    background: transparent;
    color: var(--accent-text);
    box-shadow: none;
    border: 1.5px solid var(--accent);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">Esküvő</div>
    <h1 class="names">Lili <span class="amp">&amp;</span> Márk</h1>
    <div class="date">2026.08.14.</div>

    <div class="divider"><span class="line"></span><span class="mark">❖</span><span class="line"></span></div>

    <p class="message">
      Köszönjük, hogy velünk ünnepled életünk egyik legszebb napját!
    </p>

    <div class="cta-row">
      <a class="cta" href="https://fotoshare.co/e/H8pP-OOCgN17s6WI-uY11" target="_blank" rel="noopener">Esküvői képek</a>
      <a class="cta cta-secondary" href="https://drive.google.com/file/d/1EDxpuof8pzwLXfDcPnOezhYTslY6_UsG/view?usp=sharing" target="_blank" rel="noopener">Kagyló zoom videó</a>
    </div>
  </div>
</body>
</html>
