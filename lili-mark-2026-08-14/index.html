<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Lili &amp; Márk esküvője — 2026.08.14.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #fdf8f3;
    --cream-deep: #f6ecdf;
    --blush: #eaccc8;
    --gold: #b48b56;
    --gold-soft: #c9a86a;
    --ink: #4a3f35;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
  }
  body {
    font-family: "Cormorant Garamond", serif;
    background:
      radial-gradient(ellipse at top, var(--cream-deep) 0%, var(--cream) 55%);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    text-align: center;
  }
  .card {
    max-width: 640px;
    width: 100%;
    padding: 56px 40px 48px;
    position: relative;
  }
  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    border: 1px solid var(--gold-soft);
    opacity: 0.55;
  }
  .card::after {
    content: "";
    position: absolute;
    inset: 10px;
    border: 1px solid var(--gold-soft);
    opacity: 0.3;
  }
  .eyebrow {
    font-size: 0.85rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 22px;
  }
  .names {
    font-family: "Great Vibes", cursive;
    font-size: clamp(3.2rem, 11vw, 5.5rem);
    line-height: 1.15;
    color: var(--ink);
    margin: 0 0 6px;
  }
  .amp {
    color: var(--gold);
    padding: 0 0.15em;
  }
  .date {
    font-size: 1.25rem;
    letter-spacing: 0.12em;
    color: var(--gold);
    margin-bottom: 30px;
  }
  .divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin: 0 auto 30px;
    max-width: 260px;
  }
  .divider .line {
    flex: 1;
    height: 1px;
    background: var(--gold-soft);
    opacity: 0.6;
  }
  .divider .mark {
    color: var(--gold);
    font-size: 1.1rem;
    transform: rotate(45deg);
  }
  .message {
    font-size: 1.5rem;
    font-style: italic;
    line-height: 1.55;
    color: var(--ink);
    margin: 0 0 34px;
  }
  .note {
    font-size: 1.05rem;
    letter-spacing: 0.02em;
    color: #7a6c5d;
    border-top: 1px solid var(--blush);
    padding-top: 26px;
    margin: 0;
  }
  .note strong {
    color: var(--gold);
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">Esküvő</div>
    <h1 class="names">Lili <span class="amp">&amp;</span> Márk</h1>
    <div class="date">2026. augusztus 14.</div>

    <div class="divider"><span class="line"></span><span class="mark">❖</span><span class="line"></span></div>

    <p class="message">
      Köszönjük, hogy velünk ünnepled életünk egyik legszebb napját!
    </p>

    <p class="note">
      Az esküvői képek <strong>hamarosan elérhetők lesznek</strong> ezen az oldalon.
    </p>
  </div>
</body>
</html>
