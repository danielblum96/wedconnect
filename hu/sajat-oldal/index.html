<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/assets/favicon/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="/assets/favicon/favicon-16.png" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="/assets/favicon/apple-touch-icon.png">
<script src="/assets/cookie-consent.js?v=3"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Készítsd el a saját esküvői oldalatokat — WedConnect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf7f2;
    --fg: #2b2620;
    --muted: #7a7266;
    --accent: #b48b56;
    --card-bg: #ffffff;
    --error: #b1451f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: "Poppins", sans-serif;
    background: var(--bg);
    color: var(--fg);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: var(--card-bg);
    max-width: 440px;
    width: 100%;
    padding: 40px 36px;
    border-radius: 12px;
    box-shadow: 0 20px 50px -20px rgba(0,0,0,0.15);
  }
  .brand {
    font-family: "Cormorant Garamond", serif;
    font-weight: 600;
    font-size: 1.6rem;
    text-align: center;
    margin-bottom: 6px;
  }
  .brand span { color: var(--accent); }
  h1 {
    text-align: center;
    font-size: 1.05rem;
    font-weight: 500;
    color: var(--muted);
    margin: 0 0 28px;
  }
  .info-box {
    background: #faf6ee;
    border: 1px solid #ece1cc;
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 0.92rem;
    color: var(--fg);
    margin-bottom: 22px;
  }
  label {
    display: block;
    font-size: 0.95rem;
    font-weight: 500;
    margin-bottom: 6px;
  }
  input {
    width: 100%;
    padding: 11px 14px;
    border: 1px solid #ddd6c9;
    border-radius: 8px;
    font-family: inherit;
    font-size: 0.95rem;
    margin-bottom: 18px;
    background: #fff;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .hint { font-size: 0.88rem; color: var(--muted); margin: -12px 0 18px; }
  button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 999px;
    background: linear-gradient(135deg, #f0c988, #b48b56);
    color: #1a1408;
    font-family: inherit;
    font-weight: 600;
    font-size: 1rem;
    letter-spacing: 0.03em;
    cursor: pointer;
    box-shadow: 0 6px 16px -8px rgba(139,102,53,0.6);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  button:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 20px -8px rgba(139,102,53,0.75);
  }
  .error {
    background: #fdeee7;
    color: var(--error);
    border: 1px solid #f3c8b3;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 0.95rem;
    margin-bottom: 18px;
    display: none;
  }
  .foot {
    text-align: center;
    margin-top: 20px;
    font-size: 0.95rem;
    color: var(--muted);
  }
  .foot a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">Wed<span>Connect</span></div>
    <h1>Készítsd el a saját esküvői oldalatokat</h1>
    <div class="info-box">Ingyen kipróbálhatod — a saját neveitekkel, dátumotokkal élesedik az oldal. Csak akkor kell fizetned, ha meg szeretnéd tartani.</div>
    <div class="error" id="err"></div>
    <form method="POST" action="/api/individual-register">
      <label for="nev">Neved</label>
      <input type="text" id="nev" name="nev" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autocomplete="username">

      <label for="jelszo">Jelszó</label>
      <input type="password" id="jelszo" name="jelszo" required autocomplete="new-password" minlength="8">
      <div class="hint">Legalább 8 karakter.</div>

      <button type="submit">Ingyenes kezdés</button>
    </form>
    <div class="foot">Már van fiókod? <a href="/sajat/bejelentkezes">Jelentkezz be itt</a></div>
  </div>
  <script>
    var params = new URLSearchParams(location.search);
    var err = params.get("error");
    if (err) {
      var messages = {
        missing_fields: "Kérjük, töltsön ki minden mezőt.",
        weak_password: "A jelszónak legalább 8 karakter hosszúnak kell lennie.",
        invalid_email: "Kérjük, adjon meg egy érvényes email-címet.",
        email_exists: "Ez az email-cím már regisztrálva van.",
        rate_limited: "Túl sok regisztrációs kísérlet. Kérjük, próbálja meg később."
      };
      var box = document.getElementById("err");
      box.textContent = messages[err] || "Valami hiba történt. Kérjük, próbálja meg újra.";
      box.style.display = "block";
    }
  </script>
<div style="text-align:center; padding:18px 20px; font-size:0.8rem;"><a href="#" data-cookie-settings style="color:#8c6d34;">Süti-beállítások</a></div>
</body>
</html>
